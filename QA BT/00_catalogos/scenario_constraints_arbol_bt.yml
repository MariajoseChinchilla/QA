  case_count_core: 221000
  case_count_with_bt_control: 222000
business_glossary:
  labor: Persona que desembolsó el crédito. Campos participanteLabor*. Su CN laboral puede ser distinto del CN donde vendió.
  asignacion: A quién pertenece actualmente el cliente. Campos clienteEsCarteraDel*, participanteAsignadoCod y asignado*.
  cosecha: CN donde se desembolsó el crédito. Campos cnCosecha*. Puede diferir de participanteLaborCn.
  cn_labor_vs_cn_cosecha: participanteLaborCn identifica el CN de adscripción del vendedor; cnCosechaCod identifica el CN transaccional donde
    se desembolsó.
global_constraints:
  xml_must_include_all_cn_and_abf_catalog: Cada XML debe incluir todos los CNs y todos los ABFs asignados a cada CN, no solo los candidatos de
    la ruta.
  route_forcing: Cada caso debe fijar condiciones de General y de subreglas hasta llegar a salida final.
  random_outputs: Para comparación exacta, generar un solo candidato elegible; para aleatoriedad real, usar accepted_set.
  normalization:
  - Estados ALTA/BAJA
  - Banca BANCA_PERSONAS/BANCA_TRABAJADORES
  - Booleanos SI/NO y 0/1 según campo
  - Región y municipio homologados
