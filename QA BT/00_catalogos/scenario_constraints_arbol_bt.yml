    - Incluir ABFs decoy de alta/baja, con/sin déficit y con edades cercanas/no cercanas según ruta.
    - Evitar candidatos fuera del candidate_scope que cumplan filtros de patrono, región, municipio o desembolso.
    - Cuando se requiera CN abierto, crear al menos un CN cerrado equivalente como control negativo.
